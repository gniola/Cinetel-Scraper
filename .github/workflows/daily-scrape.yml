name: Cinetel daily scrape

on:
  schedule:
   schedule:
    # Due cron: uno per l'ora legale (CEST) e uno per l'ora solare (CET).
    # Il passo "Controlla stagione" lascia procedere solo quello giusto,
    # cosi' l'email parte sempre alle 7:17 ora di Roma tutto l'anno.
    - cron: "7 5 * * 1"   # 07:7 a Roma in CEST (UTC+2)
    - cron: "7 6 * * 1"   # 07:7 a Roma in CET  (UTC+1)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape_cinetel.py

      - name: Commit and push data
        run: |
          git config user.name "cinetel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da salvare."
          else
            git commit -m "Aggiornamento dati Cinetel $(date -u +%Y-%m-%d)"
            git push
          fi
