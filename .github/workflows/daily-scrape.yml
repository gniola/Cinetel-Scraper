name: Cinetel daily scrape

on:
  schedule:
    # 05:30 UTC = 06:30/07:30 ora italiana (CET/CEST) — dopo la mezzanotte,
    # quando i dati del giorno precedente sono definitivi su cinetel.it.
    - cron: "30 5 * * *"
  workflow_dispatch: {}  # permette anche di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scripts/scrape_cinetel.py

      - name: Commit and push data
        run: |
          git config user.name "cinetel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo da salvare."
          else
            git commit -m "Aggiornamento dati Cinetel $(date -u +%Y-%m-%d)"
            git push
          fi
