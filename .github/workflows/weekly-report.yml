name: Cinetel weekly report

on:
  schedule:
    # Due cron: uno per l'ora legale (CEST) e uno per l'ora solare (CET).
    # Il passo "Controlla stagione" lascia procedere solo quello giusto,
    # cosi' l'email parte sempre alle 7:17 ora di Roma tutto l'anno.
    - cron: "17 5 * * 1"   # 07:17 a Roma in CEST (UTC+2)
    - cron: "17 6 * * 1"   # 07:17 a Roma in CET  (UTC+1)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send weekly report email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/weekly_report.py
